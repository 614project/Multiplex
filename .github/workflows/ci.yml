name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Pushes to this repository's branches already run here, so pull requests only add runs for forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/build.yml
    with:
      # Pushes only run the tests; pull requests and manual runs also build every platform.
      package: ${{ github.event_name != 'push' }}
