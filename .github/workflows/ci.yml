name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
            output: build/linux/x64/release/bundle
          - target: windows
            os: windows-latest
            output: build/windows/x64/runner/Release
          - target: macos
            os: macos-latest
            output: build/macos/Build/Products/Release/Multiplex.zip
          - target: apk
            os: ubuntu-latest
            output: build/app/outputs/flutter-apk/app-release.apk
    steps:
      - uses: actions/checkout@v4
      - if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release
      - if: matrix.target == 'macos'
        working-directory: build/macos/Build/Products/Release
        run: ditto -c -k --keepParent Multiplex.app Multiplex.zip
      - uses: actions/upload-artifact@v4
        with:
          name: multiplex-${{ matrix.target }}
          path: ${{ matrix.output }}
          if-no-files-found: error
