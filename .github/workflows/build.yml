name: Build

# Reusable workflow: tests the app and, when `package` is true, builds and packages it for every
# platform. Each platform uploads its files as a `multiplex-<platform>` artifact.
on:
  workflow_call:
    inputs:
      version:
        description: Version to stamp into the builds, with or without a leading "v" (default is the pubspec version)
        type: string
        default: ''
      package:
        description: Build and package every platform after the tests
        type: boolean
        default: true
    outputs:
      version:
        description: The resolved version, e.g. 1.2.0 or 1.2.0-beta.1
        value: ${{ jobs.version.outputs.version }}
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build-name: ${{ steps.version.outputs.build-name }}
      build-number: ${{ steps.version.outputs.build-number }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED#v}"
          if [[ -z "$version" ]]; then
            version="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"
          fi
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a version like 1.2.0 or 1.2.0-beta.1"
            exit 1
          fi
          major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}"
          # Store and OS version fields only take numbers; the full version goes into the app itself.
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build-name=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "build-number=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"
          echo "Version $version (build $((major * 10000 + minor * 100 + patch)))" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test

  linux:
    name: Linux
    if: inputs.package
    needs: [version, test]
    # The oldest supported runner keeps the glibc requirement low.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: >-
          flutter build linux --release
          --build-name=${{ needs.version.outputs.build-name }}
          --build-number=${{ needs.version.outputs.build-number }}
          --dart-define=MULTIPLEX_VERSION=${{ needs.version.outputs.version }}
      - run: packaging/linux/package.sh "${{ needs.version.outputs.version }}" dist
      - uses: actions/upload-artifact@v6
        with:
          name: multiplex-linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows
    if: inputs.package
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: >-
          flutter build windows --release
          --build-name=${{ needs.version.outputs.build-name }}
          --build-number=${{ needs.version.outputs.build-number }}
          --dart-define=MULTIPLEX_VERSION=${{ needs.version.outputs.version }}
      - run: ./packaging/windows/package.ps1 -Version "${{ needs.version.outputs.version }}" -OutputDir dist
        shell: pwsh
      - uses: actions/upload-artifact@v6
        with:
          name: multiplex-windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS
    if: inputs.package
    needs: [version, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: >-
          flutter build macos --release
          --build-name=${{ needs.version.outputs.build-name }}
          --build-number=${{ needs.version.outputs.build-number }}
          --dart-define=MULTIPLEX_VERSION=${{ needs.version.outputs.version }}
      - run: packaging/macos/package.sh "${{ needs.version.outputs.version }}" dist
      - uses: actions/upload-artifact@v6
        with:
          name: multiplex-macos
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS
    if: inputs.package
    needs: [version, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: >-
          flutter build ios --release --no-codesign
          --build-name=${{ needs.version.outputs.build-name }}
          --build-number=${{ needs.version.outputs.build-number }}
          --dart-define=MULTIPLEX_VERSION=${{ needs.version.outputs.version }}
      - run: packaging/ios/package.sh "${{ needs.version.outputs.version }}" dist
      - uses: actions/upload-artifact@v6
        with:
          name: multiplex-ios
          path: dist/*
          if-no-files-found: error

  android:
    name: Android
    if: inputs.package
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with a temporary debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/key.properties
      - run: flutter pub get
      - run: >-
          flutter build apk --release
          --build-name=${{ needs.version.outputs.build-name }}
          --build-number=${{ needs.version.outputs.build-number }}
          --dart-define=MULTIPLEX_VERSION=${{ needs.version.outputs.version }}
      - run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Multiplex-${{ needs.version.outputs.version }}-android.apk"
      - uses: actions/upload-artifact@v6
        with:
          name: multiplex-android
          path: dist/*
          if-no-files-found: error
